version: '3.8'

services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${TODO_PORT:-7540}:${TODO_PORT:-7540}"
    environment:
      - TODO_PORT=${TODO_PORT:-7540}
      - TODO_DBFILE=/data/scheduler.db
      - TODO_PASSWORD=${TODO_PASSWORD:-}
    volumes:
      - todo_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${TODO_PORT:-7540}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  todo_data: